[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield-ingest"
version = "0.1.0"
description = "Checkpoint-only Python client for AgentShield-eBPF"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AgentShield-eBPF contributors" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["agentshield*"]
